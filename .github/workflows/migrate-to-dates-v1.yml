name: Normalize HSdeck dated cards
on:
  push:
    paths:
      - '.github/workflows/migrate-to-dates-v1.yml'
      - 'tools/dated-migration-dates.json'
      - 'data/**'
      - 'cards.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dated-cards-scholomance-academy
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable shared converter
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/qxwd565/legacy/733f4fb359732b0a3599029387082e968d77010a/tools/convert-to-dates-v1.py' -o /tmp/convert-to-dates-v1.py
      - name: Verify and convert date-first card sources
        run: |
          python /tmp/convert-to-dates-v1.py --root . --strict
          python /tmp/convert-to-dates-v1.py --root . --strict --check
          git diff --check
      - name: Cross-check playable release dates and sync public card index
        run: |
          python - <<'PYRELEASE'
          import json
          from pathlib import Path
          catalog=Path("cards.json")
          doc=json.loads(catalog.read_text(encoding="utf-8"))
          if len(doc.get("cards",[]))!=201: raise SystemExit("Card count changed")
          for card in doc["cards"]:
              dated=json.loads((Path("data")/(card["id"]+".json")).read_text(encoding="utf-8"))
              dates=sorted(k for k in dated if len(k)==10 and k[4]=="-" and k[7]=="-")
              if not dates: raise SystemExit("No dated history "+card["id"])
              first=dated[dates[0]]
              if first.get("id")!=card["id"] or first.get("dbfId")!=card["dbfId"]: raise SystemExit("CardID/DBF mismatch "+card["id"])
              expected="2020-07-15" if card["id"]=="SCH_199" else "2020-08-07"
              if dates[0]!=expected: raise SystemExit("Unexpected first available day "+card["id"]+" "+dates[0])
              if card.get("releasedAt") not in (None,dates[0]): raise SystemExit("Existing conflicting date "+card["id"])
              card["releasedAt"]=dates[0]
              card["releaseStatus"]="verified"
          catalog.write_text(json.dumps(doc,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          PYRELEASE
      - name: Commit dated JSON only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- data/ cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Convert Scholomance-Academy to dates-v1 JSON [skip ci]'
            git push origin HEAD:main
          fi
